[project]
name = "darwinspot-backend"
version = "0.1.0"
description = "DarwinSpot autonomous spot trading agent backend"
requires-python = ">=3.14,<3.15"
dependencies = [
  "alembic==1.19.1",
  "argon2-cffi==25.1.0",
  "cryptography==50.0.1",
  "fastapi==0.141.1",
  "httpx2==2.12.0",
  "jsonschema==4.26.0",
  "mcp==2.1.1",
  "openai==3.7.0",
  "psycopg[binary]==3.3.5",
  "pydantic==2.13.5",
  "pydantic-settings==2.12.0",
  "sqlalchemy==2.0.52",
  "uvicorn[standard]==0.52.4",
]

[dependency-groups]
dev = [
  "pyright==1.1.411",
  "ruff==0.16.5",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.14"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"


