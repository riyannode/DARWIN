services:
  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: sqlite:////data/darwinspot.db
      DEMO_MODE: "true"
      FINANCIAL_WRITES_ENABLED: "false"
      PUBLIC_SHOWCASE_ENABLED: "false"
      FRONTEND_ORIGIN: http://localhost:3000
      LOG_LEVEL: INFO
    command:
      - sh
      - -c
      - alembic upgrade head && exec uvicorn darwinspot.main:app --host 0.0.0.0 --port 8000
    volumes:
      - darwin-demo-data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')
      interval: 5s
      timeout: 3s
      retries: 20

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:8000
    environment:
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  darwin-demo-data:
